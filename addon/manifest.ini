name = discordMessageHotkeys
summary = "Discord Message Hotkeys"
description = "Read the last 10 messages in the current Discord channel with Alt+1 (newest) through Alt+0 (10th newest). Alt+D moves focus to the first unread message (the 'New messages' marker). Alt+Shift+D saves a structure dump to the Downloads folder for debugging. Outside a channel the hotkeys warn quickly instead of hanging. The message-list search is bounded, time-limited, and cached so it cannot freeze NVDA."
