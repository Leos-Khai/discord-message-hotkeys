name = discordMessageHotkeys
summary = "Discord Message Hotkeys"
description = "Read the last 10 messages in the current Discord channel with Alt+1 (newest) through Alt+0 (10th newest). Alt+D moves focus to the first unread message (the 'New messages' marker). Alt+Shift+N cycles auto-reading of incoming messages in the open channel (off, polite, interrupt); the default is also set in NVDA Settings. Alt+Shift+D saves a structure dump to the Downloads folder for debugging. Outside a channel the hotkeys warn quickly instead of hanging. The message-list search is bounded, time-limited, and cached so it cannot freeze NVDA."
version = 0.7.1
author = "Khai <khaishern8235@gmail.com>"
url = https://github.com/Leos-Khai/discord-message-hotkeys
docFileName = readme.html
minimumNVDAVersion = 2022.1
lastTestedNVDAVersion = 2026.1
updateChannel = None
