name = discordMessageHotkeys
summary = "Discord Message Hotkeys"
description = "Read the last 10 messages in the current Discord channel with Alt+1 (newest) through Alt+0 (10th newest). Press the same key twice quickly to reply to that message. Alt+D moves focus to the first unread message (the 'New messages' marker). Alt+V opens the focused message in a read-only window for reviewing with the arrow keys. Ctrl+Shift+S moves focus to the current server in the server list, and Ctrl+Shift+C to the current channel or direct message in the channel list. Ctrl+Shift+Z moves focus to the message box, or the first friend on the Friends page; Ctrl+Shift+A to the first person in Active Now; Ctrl+Shift+X to the user status and settings area. Ctrl+Shift+Z moves focus to the message box, or the first friend on the Friends page; Ctrl+Shift+A to the first person in Active Now. Alt+Shift+N cycles auto-reading of incoming messages in the open channel (off, polite, interrupt); the default is also set in NVDA Settings. NVDA+Ctrl+Shift+F10 saves a structure dump to the Downloads folder for debugging. Outside a channel the hotkeys warn quickly instead of hanging. The message-list search is bounded, time-limited, and cached so it cannot freeze NVDA."
version = 0.9.0
author = "Khai <khaishern8235@gmail.com>"
url = https://github.com/Leos-Khai/discord-message-hotkeys
docFileName = readme.html
minimumNVDAVersion = 2022.1
lastTestedNVDAVersion = 2026.1
updateChannel = None
